# The UI's nginx proxies /api to "yelb-appserver:4567", but the appserver runs as vSphere Pods
# in the Supervisor namespace, outside this cluster. A selector-less Service + EndpointSlice
# gives that external LoadBalancer IP the in-cluster name the UI expects.
#
# ONE MANUAL GITOPS STEP: after the appserver syncs, get its LB IP with
#   kubectl -n org2-ns1-mrrtd get svc yelb-appserver
# then replace 40.60.0.9 below (a placeholder from the TEST-NET range) and commit.
apiVersion: v1
kind: Service
metadata:
  name: yelb-appserver
  labels:
    app: yelb
    tier: appserver-bridge
spec:
  ports:
    - name: http
      protocol: TCP
      port: 4567
      targetPort: 4567
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: yelb-appserver-external
  labels:
    app: yelb
    tier: appserver-bridge
    kubernetes.io/service-name: yelb-appserver
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 4567
endpoints:
  - addresses:
      - 40.60.0.9        # <-- REPLACE with the yelb-appserver LoadBalancer IP
