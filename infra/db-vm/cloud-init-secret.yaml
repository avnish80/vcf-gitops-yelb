# Cloud-init for the Yelb database VM (Ubuntu 24.04 "noble" cloud image).
# Installs PostgreSQL, opens it to the namespace network, and loads the Yelb schema.
# LAB ONLY: the password below is Yelb's built-in default and pg_hba allows md5 from anywhere.
apiVersion: v1
kind: Secret
metadata:
  name: yelb-db-cloudinit
  namespace: org2-ns1-mrrtd
  labels:
    app: yelb
    tier: db
type: Opaque
stringData:
  user-data: |
    #cloud-config
    timezone: Asia/Singapore
    package_update: true
    packages:
      - postgresql
    write_files:
      - path: /opt/yelb/yelb-init.sql
        permissions: "0644"
        content: |
          CREATE DATABASE yelbdatabase;
          \connect yelbdatabase;
          CREATE TABLE restaurants (
              name  char(30),
              count integer,
              PRIMARY KEY (name)
          );
          INSERT INTO restaurants (name, count) VALUES ('outback', 0);
          INSERT INTO restaurants (name, count) VALUES ('bucadibeppo', 0);
          INSERT INTO restaurants (name, count) VALUES ('chipotle', 0);
          INSERT INTO restaurants (name, count) VALUES ('ihop', 0);
    runcmd:
      - PGCONF=$(ls /etc/postgresql/*/main/postgresql.conf)
      - PGHBA=$(ls /etc/postgresql/*/main/pg_hba.conf)
      - sed -i "s/^#\?listen_addresses.*/listen_addresses = '*'/" "$PGCONF"
      - echo "host all all 0.0.0.0/0 md5" >> "$PGHBA"
      - systemctl restart postgresql
      - sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres_password';"
      - sudo -u postgres psql -f /opt/yelb/yelb-init.sql
      - touch /opt/yelb/.done
