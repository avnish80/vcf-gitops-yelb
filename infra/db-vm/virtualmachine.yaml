# Tier 3 - Yelb database as a VM Service VM.
apiVersion: vmoperator.vmware.com/v1alpha5
kind: VirtualMachine
metadata:
  name: yelb-db
  namespace: org2-ns1-mrrtd
  labels:
    app: yelb
    tier: db
spec:
  className: best-effort-small                 # 2 vCPU / 4 GiB
  image:
    kind: ClusterVirtualMachineImage
    name: vmi-5ab37e711e9121b34                # noble-server-cloudimg-amd64
  storageClass: cluster-wld01-01a-optimal-datastore-default-policy-autoraid
  powerState: PoweredOn
  minHardwareVersion: 17                       # image ships as HW v10
  bootstrap:
    cloudInit:
      rawCloudConfig:
        name: yelb-db-cloudinit
        key: user-data
