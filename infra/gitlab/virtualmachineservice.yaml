# NSX load balancer in front of the GitLab VM: web UI on 80, Git over SSH on 22.
apiVersion: vmoperator.vmware.com/v1alpha5
kind: VirtualMachineService
metadata:
  name: gitlab
  namespace: org2-ns1-mrrtd
  labels:
    app: gitlab
spec:
  type: LoadBalancer
  selector:
    app: gitlab
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
