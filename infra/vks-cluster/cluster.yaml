# VKS cluster that will host the Yelb UI. Shape copied from the working genai-cpu-01 cluster,
# trimmed to 1 control plane + 1 worker.
# Prune=false: removing this file from Git (or deleting the Argo app) will NOT delete the cluster.
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: yelb-vks
  namespace: org2-ns1-mrrtd
  labels:
    app: yelb
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["192.168.0.0/16"]
    services:
      cidrBlocks: ["10.96.0.0/12"]
    serviceDomain: cluster.local
  topology:
    classRef:
      name: builtin-generic-v3.7.0
      namespace: vmware-system-vks-public
    version: v1.36.2+vmware.2
    controlPlane:
      replicas: 1
    workers:
      machineDeployments:
        - class: node-pool
          name: np-1
          replicas: 1
        - class: node-pool
          name: np-apps
          replicas: 1
          variables:
            overrides:
              - name: vmClass
                value: best-effort-large      # 4 vCPU / 16 GiB, for Online Boutique
    variables:
      - name: vmClass
        value: best-effort-medium            # 2 vCPU / 8 GiB
      - name: storageClass
        value: vsan-default-storage-policy
      - name: vsphereOptions
        value:
          persistentVolumes:
            availableStorageClasses:
              - vsan-default-storage-policy
            defaultStorageClass: vsan-default-storage-policy
      - name: bootstrapAddons
        value:
          cniRef:
            name: antrea
            namespace: vmware-system-vks-public
